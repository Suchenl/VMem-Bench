name: tests

on:
  push:
    branches: [main, paper-reproduction]
  pull_request:
    branches: [main, paper-reproduction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -e ".[dev]"
      - name: Unit tests
        run: python3 -m pytest -q
