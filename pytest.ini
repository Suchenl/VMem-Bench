[pytest]
# Self-contained: run `python -m pytest` from this directory.
# `tests/` holds the bench self-tests (import `vmem_bench` only). Cross-package
# tests that also drive the MemStrata method live under
# `scripts/evaluate_baselines/tests/` and are NOT collected here on purpose.
# The two ignored files import modules that are not in the 51be2914 freeze src
# (postprocess vs postprocess_segments; vmem_bench.services). Do not invent them.
pythonpath = src
testpaths = tests
addopts = --ignore=tests/test_pipeline_vlm_dominant.py --ignore=tests/test_services_placement.py
